# ─────────────────────────────────────────────────────────────
# VidyaConnect - GitHub Actions CI/CD Pipeline
# Triggers on push to main branch
# Builds Docker images, pushes to ECR, deploys to EC2
# ─────────────────────────────────────────────────────────────

name: Deploy VidyaConnect to EC2

on:
  push:
    branches:
      - main

jobs:

  # ── Job 1: Run Tests ──────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install and test school-user-service
        run: |
          cd backend/services/school-user-service
          npm ci
          npm test

      - name: Install and test announcement-service
        run: |
          cd backend/services/announcement-service
          npm ci
          npm test

      # Add similar steps for other services as they are developed

  # ── Job 2: Build and Push Docker Images ──────────────────
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push school-user-service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f backend/services/school-user-service/Dockerfile \
            -t $ECR_REGISTRY/vidyaconnect-school-user-service:$IMAGE_TAG \
            backend/services
          docker push $ECR_REGISTRY/vidyaconnect-school-user-service:$IMAGE_TAG

      - name: Build and push announcement-service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f backend/services/announcement-service/Dockerfile \
            -t $ECR_REGISTRY/vidyaconnect-announcement-service:$IMAGE_TAG \
            backend/services
          docker push $ECR_REGISTRY/vidyaconnect-announcement-service:$IMAGE_TAG

      - name: Build and push attendance-service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f backend/services/attendance-service/Dockerfile \
            -t $ECR_REGISTRY/vidyaconnect-attendance-service:$IMAGE_TAG \
            backend/services
          docker push $ECR_REGISTRY/vidyaconnect-attendance-service:$IMAGE_TAG

      - name: Build and push assignment-service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f backend/services/assignment-service/Dockerfile \
            -t $ECR_REGISTRY/vidyaconnect-assignment-service:$IMAGE_TAG \
            backend/services
          docker push $ECR_REGISTRY/vidyaconnect-assignment-service:$IMAGE_TAG

      - name: Build and push consent-form-service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f backend/services/consent-form-service/Dockerfile \
            -t $ECR_REGISTRY/vidyaconnect-consent-form-service:$IMAGE_TAG \
            backend/services
          docker push $ECR_REGISTRY/vidyaconnect-consent-form-service:$IMAGE_TAG

      - name: Build and push file-service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f backend/services/file-service/Dockerfile \
            -t $ECR_REGISTRY/vidyaconnect-file-service:$IMAGE_TAG \
            backend/services
          docker push $ECR_REGISTRY/vidyaconnect-file-service:$IMAGE_TAG

      - name: Build and push notification-service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f backend/services/notification-service/Dockerfile \
            -t $ECR_REGISTRY/vidyaconnect-notification-service:$IMAGE_TAG \
            backend/services
          docker push $ECR_REGISTRY/vidyaconnect-notification-service:$IMAGE_TAG

      - name: Build and push report-service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f backend/services/report-service/Dockerfile \
            -t $ECR_REGISTRY/vidyaconnect-report-service:$IMAGE_TAG \
            backend/services
          docker push $ECR_REGISTRY/vidyaconnect-report-service:$IMAGE_TAG

      - name: Build and push web-admin
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/vidyaconnect-web-admin:$IMAGE_TAG \
            web-admin
          docker push $ECR_REGISTRY/vidyaconnect-web-admin:$IMAGE_TAG

  # ── Job 3: Deploy to EC2 ──────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Go to project folder on EC2
            cd /home/ubuntu/vidyaconnect

            # Pull latest code
            git pull origin main

            # Set image tag to current commit
            export IMAGE_TAG=${{ github.sha }}
            export ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}

            # Login to ECR
            aws ecr get-login-password --region ap-southeast-1 | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            # Pull new images
            docker compose -f infra/docker/docker-compose.production.yml pull

            # Restart all services with new images
            docker compose -f infra/docker/docker-compose.production.yml up -d

            # Remove old unused images to save disk space
            docker image prune -f